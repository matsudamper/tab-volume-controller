<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-root">
    <div id="permission-warning" hidden>
      <p>このタブへのアクセスが許可されていません。</p>
      <button id="grant" type="button">サイトへのアクセスを許可</button>
    </div>

    <header>
      <span id="origin">-</span>
    </header>

    <div class="row volume">
      <button id="mute" type="button" class="icon" aria-pressed="false" title="ミュート">🔊</button>
      <div class="slider-wrap">
        <input id="slider" type="range" min="0" max="200" step="1" value="100" />
      </div>
      <output id="value">100%</output>
    </div>

    <div class="row presets">
      <button type="button" data-v="0">0%</button>
      <button type="button" data-v="25">25%</button>
      <button type="button" data-v="50">50%</button>
      <button type="button" data-v="100">100%</button>
      <button type="button" data-v="200">200%</button>
    </div>

    <div class="row site">
      <button id="save-default" type="button">既定値に保存</button>
      <button id="clear-default" type="button" hidden>既定値を削除</button>
    </div>
    <p id="default-note" class="note" hidden></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
