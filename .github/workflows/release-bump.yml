name: Release Bump

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse released version
        id: released
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Plan bump action
        id: plan
        uses: ./.github/actions/release-plan
        with:
          version: ${{ steps.released.outputs.version }}

      - name: Create version bump PR
        if: steps.plan.outputs.already_bumped != 'true'
        uses: ./.github/actions/create-bump-pr
        with:
          released: ${{ steps.released.outputs.version }}
          next: ${{ steps.plan.outputs.next }}
          reason: v${{ steps.released.outputs.version }} のリリース公開後、次の開発バージョン ${{ steps.plan.outputs.next }} に更新します。
