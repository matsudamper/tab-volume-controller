name: Release Bump

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse released version
        id: released
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ "$tag" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "extension=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          # 単一拡張だった頃のタグ vX.Y.Z は tab-volume-controller のリリース
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "extension=tab-volume-controller" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::未知のタグ形式: ${tag}"
            exit 1
          fi

      - name: Plan bump action
        id: plan
        uses: ./.github/actions/release-plan
        with:
          extension: ${{ steps.released.outputs.extension }}
          version: ${{ steps.released.outputs.version }}

      - name: Create version bump PR
        if: steps.plan.outputs.already_bumped != 'true'
        uses: ./.github/actions/create-bump-pr
        with:
          extension: ${{ steps.released.outputs.extension }}
          released: ${{ steps.released.outputs.version }}
          next: ${{ steps.plan.outputs.next }}
          reason: ${{ steps.released.outputs.extension }} の v${{ steps.released.outputs.version }} のリリース公開後、次の開発バージョン ${{ steps.plan.outputs.next }} に更新します。
