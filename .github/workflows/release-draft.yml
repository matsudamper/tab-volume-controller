name: Release Draft

on:
  push:
    branches: [main]

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_draft=$(gh release view "v${VERSION}" --json isDraft -q '.isDraft')
          if [ "$is_draft" = "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already published."
          fi

      - name: Skip when already published
        if: steps.release.outputs.published == 'true'
        run: echo "v${{ steps.version.outputs.version }} は既にリリース済みです。"

      - name: Create or update draft release PR
        if: steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          branch="release/v${VERSION}"
          existing_pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')

          # このワークフローを起動したコミットを release ブランチへ反映し、PR Build を再実行させる
          git push origin "${SHA}:refs/heads/${branch}"

          if [ -n "$existing_pr" ]; then
            echo "Updated draft PR #${existing_pr}"
            exit 0
          fi

          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "release: v${VERSION}" \
            --body "main の更新に追従するリリース用ドラフト PR です。PR ビルド成果物を確認し、GitHub Releases から手動で公開してください。公開後、次バージョンへの更新 PR が自動作成されます。"
