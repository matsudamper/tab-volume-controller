name: Release Draft

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extension:
        description: 下書きを更新する拡張
        required: true
        type: choice
        options:
          - tab-volume-controller

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-draft:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || matrix.extension == inputs.extension
    strategy:
      fail-fast: false
      matrix:
        extension:
          - tab-volume-controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan release action
        id: plan
        uses: ./.github/actions/release-plan
        with:
          extension: ${{ matrix.extension }}

      - name: Create version bump PR
        if: steps.plan.outputs.published == 'true' && steps.plan.outputs.already_bumped != 'true'
        uses: ./.github/actions/create-bump-pr
        with:
          extension: ${{ matrix.extension }}
          released: ${{ steps.plan.outputs.version }}
          next: ${{ steps.plan.outputs.next }}
          reason: ${{ matrix.extension }} の v${{ steps.plan.outputs.version }} は公開済みのため、次の開発バージョン ${{ steps.plan.outputs.next }} に更新します。

      - name: Sync draft release
        if: steps.plan.outputs.published != 'true'
        uses: ./.github/actions/sync-draft-release
        with:
          extension: ${{ matrix.extension }}
          version: ${{ steps.plan.outputs.version }}
          tag: ${{ steps.plan.outputs.tag }}
