name: PR Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build extension package
        id: package
        run: |
          npx web-ext build --source-dir=src --artifacts-dir=web-ext-artifacts --overwrite-dest
          built_zip=$(ls web-ext-artifacts/*.zip)
          xpi_path="web-ext-artifacts/tab-volume-controller-${{ steps.version.outputs.version }}.xpi"
          cp "$built_zip" "$xpi_path"
          unzip -l "$xpi_path" | grep -q ' manifest.json$'
          echo "xpi=$xpi_path" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tab-volume-controller-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.xpi }}
          archive: false
          if-no-files-found: error

      - name: Find existing artifact comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- pr-build-artifact -->"

      - name: Comment PR with artifact link
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- pr-build-artifact -->
            ## PR ビルド成果物

            この PR の最新ビルドから生成された拡張機能です。

            | 項目 | 値 |
            | --- | --- |
            | バージョン | `${{ steps.version.outputs.version }}` |
            | ファイル名 | `tab-volume-controller-${{ steps.version.outputs.version }}.xpi` |
            | ビルド | [Actions 実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            **[拡張機能をダウンロード](${{ steps.upload.outputs.artifact-url }})**

            > GitHub にログインしている必要があります。
