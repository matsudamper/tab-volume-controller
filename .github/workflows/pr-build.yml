name: PR Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  list-extensions:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: list
        uses: ./.github/actions/list-extensions

  build:
    needs: list-extensions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.list-extensions.outputs.extensions) }}
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Read version
        id: version
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build extension package
        id: package
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          npx web-ext build --source-dir=src --artifacts-dir=web-ext-artifacts --overwrite-dest
          built_zip=$(ls web-ext-artifacts/*.zip)
          xpi_path="web-ext-artifacts/${EXTENSION}-${{ steps.version.outputs.version }}.xpi"
          cp "$built_zip" "$xpi_path"
          unzip -l "$xpi_path" | grep -q ' manifest.json$'
          echo "xpi=extensions/${EXTENSION}/${xpi_path}" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.extension }}-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.xpi }}
          archive: false
          if-no-files-found: error

      - name: Upload download QR code
        id: github_qr_artifact
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload.outputs.artifact-url }}
          output_path: qrcode-github.png
          artifact_name: xpi-qr-code-github-${{ matrix.extension }}

      - name: Comment PR with artifact link
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          comment-tag: pr-build-artifact-${{ matrix.extension }}
          message: |
            ## PR ビルド成果物

            **`${{ matrix.extension }}-${{ steps.version.outputs.version }}.xpi`**

            - [Download](${{ steps.upload.outputs.artifact-url }})
            - [QRコード](${{ steps.github_qr_artifact.outputs.artifact-url }})
            - [Actions 実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
