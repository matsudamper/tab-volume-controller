name: PR Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build extension package
        id: package
        run: |
          npx web-ext build --source-dir=src --artifacts-dir=web-ext-artifacts --overwrite-dest
          built_zip=$(ls web-ext-artifacts/*.zip)
          xpi_path="web-ext-artifacts/tab-volume-controller-${{ steps.version.outputs.version }}.xpi"
          cp "$built_zip" "$xpi_path"
          unzip -l "$xpi_path" | grep -q ' manifest.json$'
          echo "xpi=$xpi_path" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        id: upload_xpi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tab-volume-controller-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.xpi }}
          archive: false
          if-no-files-found: error

      - name: Generate download QR code
        if: github.event_name == 'pull_request'
        run: |
          pip install "qrcode[pil]" --quiet
          python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-github.png')" "${{ steps.upload_xpi.outputs.artifact-url }}"

      - name: Upload download QR artifact
        if: github.event_name == 'pull_request'
        id: github_qr_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpi-qr-code-github
          path: qrcode-github.png
          archive: false
