name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Bump patch version
        id: version
        run: |
          version=$(node -p "
            const fs = require('fs');
            const path = './src/manifest.json';
            let content = fs.readFileSync(path, 'utf8');
            const match = content.match(/\"version\": \"([^\"]+)\"/);
            if (!match) throw new Error('version not found');
            const parts = match[1].split('.').map(Number);
            parts[2] = (parts[2] || 0) + 1;
            const newVersion = parts.join('.');
            content = content.replace(/\"version\": \"[^\"]+\"/, '\"version\": \"' + newVersion + '\"');
            fs.writeFileSync(path, content);
            newVersion;
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Build extension zip
        run: npx web-ext build --source-dir=src --artifacts-dir=web-ext-artifacts --overwrite-dest

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" web-ext-artifacts/*.zip --title "$TAG"
