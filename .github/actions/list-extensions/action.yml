name: List extensions
description: extensions/*/src/manifest.json を持つ拡張名の一覧を返す
outputs:
  extensions:
    description: 拡張ディレクトリ名の JSON 配列
    value: ${{ steps.list.outputs.extensions }}
runs:
  using: composite
  steps:
    - id: list
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        mapfile -t names < <(find extensions -mindepth 3 -maxdepth 3 -type f -path 'extensions/*/src/manifest.json' | sed -E 's#^extensions/##; s#/src/manifest.json$##' | sort)
        if [ "${#names[@]}" -eq 0 ]; then
          echo "::error::extensions/*/src/manifest.json がありません"
          exit 1
        fi
        json=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)
        {
          echo "extensions<<EOF"
          echo "${json}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
