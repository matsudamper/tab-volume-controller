name: Sync draft release
description: 拡張機能をビルドし GitHub Draft Release を作成または更新する
inputs:
  extension:
    description: extensions/ 以下のディレクトリ名
    required: true
  version:
    description: リリース対象バージョン
    required: true
  tag:
    description: 作成または更新する GitHub Release タグ
    required: true
outputs:
  release_url:
    description: Draft Release の URL
    value: ${{ steps.sync.outputs.release_url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "20"

    - id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/extensions/${{ inputs.extension }}
      env:
        GH_TOKEN: ${{ github.token }}
        EXTENSION: ${{ inputs.extension }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        npx web-ext build --source-dir=src --artifacts-dir=web-ext-artifacts --overwrite-dest
        built_zip=$(ls web-ext-artifacts/*.zip)
        xpi_path="web-ext-artifacts/${EXTENSION}-${VERSION}.xpi"
        cp "$built_zip" "$xpi_path"
        unzip -l "$xpi_path" | grep -q ' manifest.json$'

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "$xpi_path" --clobber
          echo "Updated draft release ${TAG}"
        else
          gh release create "$TAG" "$xpi_path" --draft --title "$TAG"
          echo "Created draft release ${TAG}"
        fi

        release_url=$(gh release view "$TAG" --json url -q .url)
        echo "release_url=${release_url}" >> "$GITHUB_OUTPUT"
